<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#162238">
  <title>企業民刑法專題｜九題刷題</title>
  <meta name="description" content="企業民刑法專題九題，支援隨機出題、錯題重練及顯示或隱藏答案。">
  <style>
    :root{--ink:#162238;--accent:#d65a31;--paper:#f7f4ed;--white:#ffffff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.75}
    button,select{font:inherit;color:inherit}
    button{cursor:pointer}
    header{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--white);padding:max(12px,env(safe-area-inset-top)) 16px 12px}
    .head{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:1.1rem;margin:0}.tag{color:var(--accent);font-weight:900;font-size:.85rem}
    .wrap{max-width:760px;margin:auto;padding:18px 14px calc(38px + env(safe-area-inset-bottom))}
    .tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:14px}
    select,.btn{min-height:46px;border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:9px 12px;font-weight:800}
    .btn:active{background:var(--paper)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--white)}
    .btn.marked{background:var(--ink);color:var(--white)}
    .card{background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:14px}
    .kicker{margin:0 0 4px;color:var(--accent);font-weight:900;font-size:.86rem}
    h2{font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.35;margin:0 0 16px}
    .prompt{white-space:pre-wrap;font-weight:700}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
    .answer{display:none}.answer.open{display:block}
    .answer h3,.concepts h3{font-size:1.15rem;margin:0 0 12px}
    .answer-line{margin:0 0 12px;white-space:pre-wrap}
    .answer-line.heading{font-weight:900;color:var(--accent);margin-top:20px;border-bottom:2px solid var(--paper);padding-bottom:5px}
    .answer-line.step{font-weight:900;margin-bottom:4px}
    .law-ref{color:var(--accent);font-weight:900}
    .concepts{margin-top:22px;padding-top:18px;border-top:2px solid var(--paper)}
    .concept{margin:0 0 10px;white-space:pre-wrap}
    .lawbox{background:var(--ink);color:var(--white);border-radius:12px;padding:13px 15px;margin-top:16px;font-weight:800}
    .lawbox .law-ref{color:var(--accent)}
    .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .note{text-align:center;font-size:.82rem;font-weight:700;margin:12px 0 0}
    [hidden]{display:none!important}
    @media(max-width:560px){.tools{grid-template-columns:1fr 1fr}.tools select{grid-column:1/-1}.card{padding:18px 16px}.actions{grid-template-columns:1fr}.head .tag{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header><div class="head"><h1>企業民刑法專題｜九題刷題</h1><span class="tag">手機版</span></div></header>
  <main class="wrap">
    <section class="tools" aria-label="出題工具">
      <select id="picker" aria-label="選擇題目"></select>
      <button class="btn" id="random" type="button">隨機出題</button>
      <button class="btn" id="wrongMode" type="button">錯題重練</button>
    </section>
    <article class="card">
      <p class="kicker" id="number"></p>
      <h2 id="title"></h2>
      <div class="prompt" id="prompt"></div>
      <div class="actions">
        <button class="btn primary" id="toggle" type="button" aria-expanded="false">顯示答案</button>
        <button class="btn" id="markWrong" type="button">加入錯題</button>
      </div>
    </article>
    <section class="card answer" id="answer" aria-live="polite">
      <h3>考題答案</h3>
      <div id="answerBody"></div>
      <div class="concepts" id="conceptSection">
        <h3>法律概念解說</h3>
        <div id="conceptBody"></div>
        <div class="lawbox" id="law"></div>
      </div>
    </section>
    <nav class="nav" aria-label="切換題目">
      <button class="btn" id="prev" type="button">上一題</button>
      <button class="btn" id="next" type="button">下一題</button>
    </nav>
    <p class="note" id="modeNote">一般練習</p>
  </main>
  <script>
    const QUESTIONS=[{"title":"第一題｜應有部分出售與優先承買權","shortTitle":"應有部分出售與優先承買權","prompt":[".甲乙丙分別共有A地，應有部分各為三分之一，試問","(一) 甲欲將其應有部分移轉與丁時，乙或丙得否主張其優先購買權? (二)若甲已與丁為系爭應有部分之買賣契約與物權移轉行為，其效力如何?乙與丙有何救濟管道?"],"answers":[{"text":"（一）乙、丙的優先承買權","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"土地法第34條之1第4項：共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。此優先承買權以有償買賣為限。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙、丙為A地共有人，甲擬將三分之一應有部分移轉予外部第三人丁。若移轉原因為買賣且價格、條件已確定，屬出賣；若為贈與等非買賣行為，則不屬之。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲如以買賣方式出賣應有部分予丁，且價格、條件已確定，即符合第34條之1第4項要件；如為贈與，則欠缺出賣要件。\n法律效果：乙、丙均得以同一價格及條件，共同或單獨向甲主張優先承買；要件不具備時，無優先承買權。","style":"Normal"},{"text":"（二）買賣、物權移轉及救濟","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第819條第1項：各共有人得自由處分其應有部分。民法第758條：不動產物權移轉，應以書面為之並經登記，始生效力。土地法第34條之1第4項的優先承買權僅具債權效力，違反時不當然影響第三人取得物權的效力。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲對自己三分之一應有部分有處分權，並已與丁成立買賣契約及完成所有權移轉登記。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲有處分權，物權移轉以書面為之並完成登記，符合第819條第1項及第758條要件。\n法律效果：買賣契約及物權移轉均有效，丁取得該應有部分；乙、丙不得向丁主張買賣或登記無效。甲如故意或過失違反保護優先承買權人的規定，並致乙、丙受有損害，乙、丙始得依民法第184條第2項請求損害賠償。","style":"Normal"}],"concepts":["應有部分：是共有人對共有物的抽象比例，不是土地上的特定位置；共有人得自由處分自己的應有部分。","債權效力：違反優先承買權不使第三人已取得的物權當然失效，原則上以損害賠償處理。"],"law":"法條依據：土地法第34條之1第4項；民法第184條第2項、第758條、第819條第1項。"},{"title":"第二題｜出售給共有人與多數決處分","shortTitle":"出售給共有人與多數決處分","prompt":["甲乙丙分別共有A地，應有部分各三分之一，試問","(一)若甲將其應有部分移轉與丙時，乙得否主張其有優先承買權? (二)若甲乙以多數決之方式，將A地移轉與戊，丙得否主張優先承買權?"],"answers":[{"text":"（一）甲移轉給丙","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"土地法第34條之1第4項：共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"丙原為A地共有人，甲移轉應有部分予丙，未引進外部第三人。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：丙非外部第三人，優先承買要件不具備。\n法律效果：乙不得主張優先承買權。","style":"Normal"},{"text":"（二）甲、乙多數決出售A地","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"土地法第34條之1第1項：共有人過半數及其應有部分合計過半數者，得處分共有土地。第2項：處分前應以書面通知他共有人。第3項：應對少數共有人償付其應得對價，不能受領或拒絕受領時得提存。第4項：出賣共有人之應有部分時，他共有人得優先承購。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙占三人中二人，持分合計三分之二；戊為外部第三人，丙未同意。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲、乙在人數及應有部分均已過半，符合第1項的多數決門檻；並應依第2項通知丙，依第3項償付或提存丙應得之對價。\n法律效果：完成法定程序後，甲、乙得出賣A地全部；丙得以同一價格及條件，優先承買甲、乙合計三分之二的應有部分。","style":"Normal"}],"concepts":["特別規定：土地法第34條之1是民法第819條第2項全體同意原則的例外。","承買範圍：丙已有三分之一，不必購買自己的部分；其承買標的是甲、乙的三分之二。"],"law":"法條依據：土地法第34條之1第1項、第2項、第4項；民法第819條第2項。"},{"title":"第三題｜多數共有人出賣共有土地全部","shortTitle":"多數共有人出賣共有土地全部","prompt":["甲乙丙分別共有A地，應有部分各三分之一，試問： 若甲乙將A地出賣與丁並將A地所有權移轉於丁，則該買賣契約與物權移轉行為效力如何?"],"answers":[{"text":"（一）買賣契約","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第348條第1項：出賣人負有交付標的物並使買受人取得所有權之義務。買賣契約屬負擔行為，原則上不以出賣人具有處分權為生效要件。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙雖僅有三分之二應有部分，仍與丁約定出售A地全部。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲、乙與丁就A地全部成立買賣的意思表示一致。\n法律效果：買賣契約有效；即使甲、乙未能使丁取得A地全部所有權，也只是能否履行及債務不履行責任問題，不使買賣契約當然無效。","style":"Normal"},{"text":"（二）所有權移轉","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第819條第2項：共有物之處分，原則上應得共有人全體同意。土地法第34條之1第1項則為其特別規定，符合人數及應有部分門檻的多數共有人，得處分共有土地全部。民法第758條：不動產物權移轉，應以書面為之並經登記，始生效力。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙占三人中二人，應有部分合計三分之二。若其已依法書面通知丙、償付或提存丙應得之對價，並以書面完成物權合意及移轉登記，即符合規定。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲、乙在人數及應有部分均已過半，且完成通知、對價償付或提存、書面及登記等法定程序。\n法律效果：A地所有權移轉有效，丁取得A地所有權；如未符合土地法第34條之1的要件或程序，則不得僅憑多數決使丁取得丙的應有部分。","style":"Normal"}],"concepts":["負擔行為：只發生給付義務，不直接移轉既有權利，因此原則上不以處分權為必要。","不動產物權行為：須有物權意思表示、書面、處分權及登記。土地法第34條之1使符合門檻的多數共有人取得處分共有土地全部的法定權限。","少數共有人保障：丙得依土地法第34條之1第4項，以同一價格及條件優先承買甲、乙的應有部分。"],"law":"法條依據：土地法第34條之1第1項至第4項；民法第348條、第758條、第819條。"},{"title":"第四題｜設定抵押權與部分共有人自行分割","shortTitle":"設定抵押權與部分共有人自行分割","prompt":["甲乙丙分別共有A地，應有部分各三分之一，試問：","(一)若甲乙以A地為丁設定抵押權，則該抵押權設定行為效力如何?"," (二)若甲乙自行為共有物之分割，則該分割之效力如何?"],"answers":[{"text":"（一）以A地全部設定抵押權","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第819條第2項：共有物之處分、變更及設定負擔，應得共有人全體同意。土地法第34條之1第1項雖容許多數共有人處分共有土地，但其列舉範圍不包括設定抵押權。民法第118條第1項：無權利人就權利標的物所為的處分，經有權利人承認始生效力。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙未經丙同意，即以A地全部為丁設定抵押權；甲、乙只能處分自己的應有部分，無權處分丙的應有部分。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：未經丙同意，欠缺第819條第2項所要求的全體同意；土地法第34條之1亦不能作為多數決設定抵押權的依據。\n法律效果：就丙應有部分屬無權處分，效力未定，須經丙承認始生效力；丙拒絕承認時，對丙不生效力。如已就丙的權利範圍完成登記，丙得請求塗銷。至於能否僅在甲、乙的應有部分成立抵押權，應依當事人的設定意思及行為可否分割判斷。","style":"Normal"},{"text":"（二）甲、乙自行分割","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第824條第1項：共有物之分割，依共有人協議之方法行之；協議分割須由全體共有人共同決定。A地為不動產時，完成物權分割尚須依民法第758條以書面為之並辦理登記。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙未經丙同意，自行分割A地。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲、乙未經丙同意，欠缺全體共有人共同參與及同意的要件。\n法律效果：甲、乙間的約定不能使A地發生分割效力，也不得拘束丙；如全體無法達成協議，任何共有人均得訴請法院裁判分割。","style":"Normal"}],"concepts":["設定抵押權：使所有權受限制，屬物權處分行為。","分割的兩階段：分割協議是負擔行為；辦理交付或登記的協議分割是處分行為。"],"law":"法條依據：土地法第34條之1；民法第118條、第758條、第767條、第819條、第823條、第824條。"},{"title":"第五題｜全體共有人協議分割土地","shortTitle":"全體共有人協議分割土地","prompt":["甲、乙、丙三人共有A地，應有部分各三分之一，若甲、乙、丙三人欲透過協議分割系爭A地，試問其應如何為之？"],"answers":[{"text":"（一）訂立分割協議","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第824條第1項：共有物之分割，依共有人協議之方法行之。協議分割須由全體共有人共同決定分割方法。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲、乙、丙均同意分割A地。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲、乙、丙全體均同意分割方法，符合協議成立要件。\n法律效果：分割協議成立，三人互負依約完成分割的義務；任一方不履行時，他方得請求履行。","style":"Normal"},{"text":"（二）完成協議分割","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第758條：依法律行為發生不動產物權變動者，應以書面為之並經登記，始生效力。民法第824條之1第1項：共有人自分割之效力發生時起，取得分得部分之所有權。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"A地為不動產，三人除成立分割協議外，尚須以書面完成分割的物權合意，並辦理分割登記。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：全體共有人已協議分割，並以書面完成物權合意及分割登記。\n法律效果：登記時發生協議分割的物權效力，共有關係消滅，各自取得分得土地的所有權。","style":"Normal"}],"concepts":["先協議、後登記：分割協議只產生履行義務；登記後才完成不動產協議分割。"],"law":"法條依據：民法第758條、第824條第1項、第824條之1第1項。"},{"title":"第六題｜分割協議與十五年消滅時效","shortTitle":"分割協議與十五年消滅時效","prompt":["甲、乙、丙三人共有A地，應有部分各三分之一。若三人已於民國80年簽訂分割協議，試問於民國96年時甲應為如何之主張？"],"answers":[{"text":"（一）請求履行分割協議","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第125條：一般請求權自可行使時起，因十五年間不行使而消滅。民法第144條第1項：時效完成後，債務人得拒絕給付。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"分割協議簽於民國80年。若自簽約時甲即可請求辦理分割登記，至民國96年已逾十五年，且題目未見時效中斷或不完成事由。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：如履行請求權自民國80年即可行使，至民國96年已逾十五年，符合消滅時效完成要件。\n法律效果：甲仍得請求乙、丙依分割協議辦理登記，但乙、丙得依第144條提出時效抗辯而拒絕履行；若約定較晚的履行期或有時效中斷事由，則應另行計算。","style":"Normal"},{"text":"（二）改請求裁判分割","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第823條第1項所定共有物分割請求權，屬形成權，原則上不因消滅時效而消滅。依民國96年當時實務見解，分割協議的履行請求權時效完成並經共有人拒絕履行後，仍得請求法院裁判分割；此見解其後明定於民法第824條第2項。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"如乙、丙提出時效抗辯而拒絕履行原分割協議，A地的共有關係仍未消滅，且已不能依該協議完成分割。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：共有關係仍存在，且原分割協議已因時效抗辯而無法履行。\n法律效果：甲得另行訴請法院裁判分割，不受原履行請求權消滅時效完成的影響。","style":"Normal"}],"concepts":["時效效果：消滅時效完成不使請求權自動消滅；債務人取得拒絕履行的抗辯權。","時間法提示：民國98年修法將既有實務見解明文化；本題在民國96年仍可依當時實務處理。"],"law":"法條依據：民法第125條、第144條、第823條、第824條。"},{"title":"第七題｜公同共有物遭第三人無權占有","shortTitle":"公同共有物遭第三人無權占有","prompt":["甲、乙、丙公同共有A地，A地為丁所無權占有，試問甲得否請求丁返還A地之占有？"],"answers":[{"text":"甲得否請求丁返還占有","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第767條第1項：所有人得向無權占有人請求返還所有物。民法第828條第2項準用第821條，故公同共有人得單獨為全體公同共有人之利益，請求第三人返還共有物。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"丁無權占有甲、乙、丙公同共有的A地；甲為公同共有人。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：丁無權占有A地，甲為A地的公同共有人。\n法律效果：甲得單獨起訴請求丁返還A地，但返還對象須為甲、乙、丙全體公同共有人，不得僅請求返還給甲個人。","style":"Normal"}],"concepts":["公同共有：各公同共有人並無可自由處分的應有部分，而是基於公同關係共同享有權利。","單獨起訴：現行民法第828條第2項已有明文準用第821條，修法前的爭議已獲解決。"],"law":"法條依據：民法第767條第1項、第821條、第828條第2項。"},{"title":"第八題｜買賣不破租賃","shortTitle":"買賣不破租賃","prompt":["甲將A屋出租與乙，並將A屋交付乙占有，嗣後甲將A屋所有權移轉與丙，丙得否對乙請求返還A屋之占有？"],"answers":[{"text":"（一）原則","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第425條第1項：出租人於租賃物交付後，承租人仍占有中，縱將所有權讓與第三人，租賃契約對受讓人仍繼續存在；此即買賣不破租賃。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"甲出租並交付A屋予乙，嗣後移轉予丙；乙仍占有A屋。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：甲已將A屋交付乙，乙於所有權移轉時仍占有A屋，符合第425條第1項要件。\n法律效果：丙依法承受出租人地位，租約對丙繼續存在；乙屬有權占有，丙不得請求返還A屋。","style":"Normal"},{"text":"（二）例外","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第425條第2項：未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用前項規定。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"題目並未記載租約同時具備「未經公證」及「期限逾五年或未定期限」等例外事實。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：依題示事實，無從認定符合第425條第2項的例外要件。\n法律效果：仍應適用買賣不破租賃，丙不得請求乙返還；僅在能證明租約未經公證，且期限逾五年或未定期限時，始不適用第1項。","style":"Normal"}],"concepts":["法定契約承擔：民法第425條使受讓人依法承受出租人地位，是契約相對性原則的例外。","不動產移轉：題目稱所有權已移轉，即以民法第758條所要求的書面與登記均已完成為前提。"],"law":"法條依據：民法第425條、第758條、第767條第1項。"},{"title":"第九題｜共有土地之使用收益與返還請求","shortTitle":"共有土地之使用收益與返還請求","prompt":["甲有A地一筆，其老友乙中年失業後，因轉職不易而窮困潦倒，甲心中不忍，故與乙就該A地右半部之特定範圍成立使用借貸契約，使乙得無償使用該範圍之土地以謀生。 乙甚有生意頭腦，將該範圍之土地畫線後裝設入口柵欄經營停車場業務，獲利頗豐。嗣後甲自己有資金需求，故將該A地出賣並移轉與丙、丁兩人，並由其各取得二分之一之應有部分。 丙取得該A地之持分後，見乙經營之停車場生意興隆，心想：「既然我已經取得A地二分之一之應有部分，已經是A地權利人，何不依樣畫葫蘆經營停車場？」因此丙在未經丁同意下，就該A地左半部之特定範圍亦開始經營停車場。 丁認為該筆土地均係乙、丙兩人在使用收益並不公平，因此遂分別請求乙、丙返還其所占有之部分予自己。試問丁之主張有無理由？"],"answers":[{"text":"（一）丁對乙之返還請求","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第767條第1項：所有人得向無權占有人請求返還所有物。民法第821條：各共有人得為全體共有人之利益，就共有物全部行使本於所有權的請求權，但回復共有物的請求，只能請求返還予全體共有人。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"乙雖依其與原所有人甲間的使用借貸契約占有右半部，但丁並非該契約當事人；使用借貸原則上僅具債權效力，不能據以對抗取得所有權的丁。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：乙的使用借貸關係原則上不能對抗丁，故乙對丁欠缺占有權源。\n法律效果：丁原請求乙返還右半部予自己，並無理由；但丁得依第767條及第821條，改為請求乙返還右半部予丙、丁全體。","style":"Normal"},{"text":"（二）使用借貸能否類推買賣不破租賃","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第425條第1項僅明定租賃物交付後的買賣不破租賃；使用借貸為無償契約，法律未設相同規定。是否類推適用，學說上有肯定說與否定說。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"乙為無償借用人，並非支付租金的承租人；使用借貸與租賃在有償性及利益衡量上有所不同。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：乙非承租人，不直接符合第425條第1項要件；依否定說，兩者規範目的及利益衡量亦不相同，不具法律漏洞。\n法律效果：乙不得類推適用第425條，不能以原使用借貸關係對抗丁。","style":"Normal"},{"text":"（三）丁對丙之返還請求","style":"Heading 3"},{"text":"1. 大前提（法律／原理原則）","style":"Normal"},{"text":"民法第818條：各共有人按其應有部分，對共有物全部有使用收益權，但不得侵害他共有人同等的使用收益權。民法第820條第1項：共有物的管理，原則上須有共有人過半數及其應有部分合計過半數的同意。另依民法第767條及第821條，共有人得為全體利益請求無權占有人返還共有物。","style":"Normal"},{"text":"2. 小前提（事實涵攝）","style":"Normal"},{"text":"丙僅有二分之一應有部分，未經丁同意，也無分管契約或合法管理決定，即排除丁而獨占A地左半部經營停車場。","style":"Normal"},{"text":"3. 結論（要件＋法律效果）","style":"Normal"},{"text":"要件：丙未取得得以排他使用左半部的分管約定或管理決定，其占有已妨害丁的同等使用收益權。\n法律效果：丁原請求丙返還左半部予自己，並無理由；但丁得改為請求丙返還左半部予丙、丁全體。","style":"Normal"}],"concepts":["1. 使用借貸與租賃不同：使用借貸是無償契約；租賃是有償契約。民法第425條只明定租賃物所有權移轉後，租約對受讓人繼續存在。使用借貸能否類推適用，仍有肯定說與否定說之爭。","2. 應有部分不是土地上的特定位置：丙取得二分之一應有部分，是對A地全部享有二分之一比例的權利，不代表丙取得左半部的單獨所有權。未經合法分管或管理決定，不得排除丁而獨占特定部分。","3. 丁得起訴，但不能要求返還給自己：丁雖得單獨行使共有物返還請求權，回復共有物仍須為全體共有人利益。故丁正確的請求方式，是要求乙、丙返還給丙、丁全體，而不是交由丁個人占有。","總結：乙與丙的占有原則上均欠缺對抗丁的合法權源，丁得分別請求返還；但丁只能請求返還給全體共有人。因此，丁要求返還給自己的主張並無理由，改為返還給丙、丁全體後始有理由。"],"law":"法條依據：民法第148條、第425條、第464條、第767條第1項、第818條、第820條及第821條。"}];
    const picker=document.getElementById('picker');
    const answer=document.getElementById('answer');
    const wrongKey='law-quiz-wrong-v1';
    let wrongs=new Set(JSON.parse(localStorage.getItem(wrongKey)||'[]'));
    let current=0,wrongMode=false;

    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const lawPattern=/((?:民法|土地法)?第\d+條(?:之\d+)?(?:第\d+項)?(?:第\d+款)?(?:前段|中段|後段)?|第\d+項)/g;
    const legal=value=>escapeHtml(value).replace(lawPattern,'<strong class="law-ref">$1</strong>');
    const activePool=()=>wrongMode?[...wrongs].sort((a,b)=>a-b):QUESTIONS.map((_,i)=>i);

    QUESTIONS.forEach((q,i)=>{
      const option=document.createElement('option');
      option.value=i;option.textContent=`第 ${i+1} 題｜${q.shortTitle}`;
      picker.appendChild(option);
    });

    function saveWrongs(){localStorage.setItem(wrongKey,JSON.stringify([...wrongs]));}
    function hideAnswer(){answer.classList.remove('open');document.getElementById('toggle').textContent='顯示答案';document.getElementById('toggle').setAttribute('aria-expanded','false');}
    function render(index){
      current=index;const q=QUESTIONS[index];picker.value=index;hideAnswer();
      document.getElementById('number').textContent=`第 ${index+1} 題`;
      document.getElementById('title').textContent=q.shortTitle;
      document.getElementById('prompt').textContent=q.prompt.join('\n');
      document.getElementById('answerBody').innerHTML=q.answers.map(item=>{
        const isHeading=item.style==='Heading 3';
        const isStep=/^[123]\. /.test(item.text);
        return `<p class="answer-line${isHeading?' heading':''}${isStep?' step':''}">${legal(item.text)}</p>`;
      }).join('');
      document.getElementById('conceptBody').innerHTML=q.concepts.map(text=>`<p class="concept">${escapeHtml(text)}</p>`).join('');
      document.getElementById('law').innerHTML=legal(q.law);
      document.getElementById('conceptSection').hidden=!q.concepts.length&&!q.law;
      const marked=wrongs.has(index),mark=document.getElementById('markWrong');
      mark.textContent=marked?'移出錯題':'加入錯題';mark.classList.toggle('marked',marked);
      const pool=activePool(),at=pool.indexOf(index);
      document.getElementById('prev').disabled=at<=0;
      document.getElementById('next').disabled=at<0||at>=pool.length-1;
      window.scrollTo({top:0,behavior:'smooth'});
    }

    picker.onchange=event=>{wrongMode=false;updateMode();render(Number(event.target.value));};
    document.getElementById('toggle').onclick=()=>{
      const open=answer.classList.toggle('open');
      document.getElementById('toggle').textContent=open?'隱藏答案':'顯示答案';
      document.getElementById('toggle').setAttribute('aria-expanded',String(open));
      if(open)answer.scrollIntoView({block:'start'});
    };
    document.getElementById('markWrong').onclick=()=>{
      wrongs.has(current)?wrongs.delete(current):wrongs.add(current);saveWrongs();
      if(wrongMode&&!wrongs.size){wrongMode=false;updateMode();}
      render(current);
    };
    document.getElementById('random').onclick=()=>{
      const pool=activePool();
      if(!pool.length){alert('目前沒有錯題。');return;}
      const choices=pool.length>1?pool.filter(i=>i!==current):pool;
      render(choices[Math.floor(Math.random()*choices.length)]);
    };
    document.getElementById('wrongMode').onclick=()=>{
      if(!wrongs.size){alert('請先把題目加入錯題。');return;}
      wrongMode=!wrongMode;updateMode();render(wrongMode?[...wrongs][0]:current);
    };
    function updateMode(){
      const button=document.getElementById('wrongMode');
      button.classList.toggle('marked',wrongMode);button.textContent=wrongMode?'結束重練':'錯題重練';
      document.getElementById('modeNote').textContent=wrongMode?'錯題重練模式':'一般練習';
    }
    document.getElementById('prev').onclick=()=>{const pool=activePool(),at=pool.indexOf(current);if(at>0)render(pool[at-1]);};
    document.getElementById('next').onclick=()=>{const pool=activePool(),at=pool.indexOf(current);if(at<pool.length-1)render(pool[at+1]);};
    updateMode();render(0);
  </script>
</body>
</html>
