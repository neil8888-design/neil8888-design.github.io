  <header><div class="head"><div class="mark">法</div><div class="brand"><small>LEGAL STUDY</small><h1>企業民刑法專題</h1></div><div class="count">共 9 題</div></div><div class="mobile-picker"><select id="picker" aria-label="選擇題目"></select></div></header>

  <script>const QUESTIONS = [{"title": "第一題｜應有部分出售與優先承買權", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一：（一）甲欲將其應有部分移轉給丁時，乙、丙有無優先承買權？（二）若甲、丁已完成買賣及所有權移轉，其效力與救濟如何？", "answer": ["（一）乙、丙的優先承買權", "答案：甲如將應有部分出賣給丁，乙、丙得主張優先承買；贈與等非買賣移轉則不得主張。", "1. 大前提（法律／原理原則）：土地法第34條之1第4項規定，共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。其前提是買賣條件已確定。", "2. 小前提（事實）：甲擬將A地三分之一應有部分移轉給共有關係外的丁。若方式為買賣，且價格及條件已確定，即符合規定；若為贈與，則不符合「出賣」。", "3. 結論（法律效果）：乙或丙得向甲，以甲、丁間的同一價格及條件，主張優先承買甲的三分之一應有部分；非買賣移轉則無此權利。", "（二）買賣、物權移轉及救濟", "答案：甲、丁間的買賣及完成登記的移轉均有效；乙、丙不得請求塗銷，但受有損害時得向甲求償。", "1. 大前提（法律／原理原則）：民法第819條第1項准許共有人自由處分其應有部分；不動產物權依民法第758條須以書面為之並完成登記。土地法第34條之1第4項的優先承買權僅具債權效力。", "2. 小前提（事實）：甲處分的是自己的三分之一應有部分，且甲、丁已成立買賣並完成所有權移轉登記。", "3. 結論（法律效果）：丁取得該應有部分。乙、丙不得向丁主張買賣或登記無效；甲妨礙其優先承買並致生損害時，乙、丙得向甲依民法第184條第2項請求損害賠償。"], "concepts": ["應有部分：是共有人對共有物的抽象比例，不是土地上的特定位置；共有人得自由處分自己的應有部分。", "債權效力：違反優先承買權不使第三人已取得的物權當然失效，原則上以損害賠償處理。"], "law": "法條依據：土地法第34條之1第4項；民法第184條第2項、第758條、第819條第1項。"}, {"title": "第二題｜出售給共有人與多數決處分", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一：（一）甲將其應有部分移轉給丙時，乙有無優先承買權？（二）甲、乙以多數決將A地出賣給戊時，丙有無優先承買權？", "answer": ["（一）甲移轉給丙", "答案：乙不得主張優先承買權。", "1. 大前提（法律／原理原則）：土地法第34條之1第4項旨在避免外部第三人進入共有關係並簡化共有；應有部分出賣給原共有人時，其他共有人無優先承買權。非買賣移轉亦不適用。", "2. 小前提（事實）：丙原為A地共有人；甲將其應有部分移轉給丙，並未引進外部第三人。", "3. 結論（法律效果）：乙不得向甲主張優先承買權。", "（二）甲、乙多數決出售A地", "答案：甲、乙得依多數決出售A地；丙得優先承買甲、乙合計三分之二的應有部分。", "1. 大前提（法律／原理原則）：土地法第34條之1第1項規定，共有人過半數且其應有部分合計過半數者，得處分共有土地；第2項要求事先書面通知他共有人；第4項保障他共有人優先承買。", "2. 小前提（事實）：甲、乙占三人中的二人，應有部分合計三分之二，均超過二分之一；戊是外部第三人，丙是未同意的共有人。", "3. 結論（法律效果）：甲、乙得出賣A地，但應事先書面通知丙。丙得向甲、乙，以同一價格及條件優先承買其合計三分之二的應有部分；承買後，丙取得A地全部所有權。"], "concepts": ["特別規定：土地法第34條之1是民法第819條第2項全體同意原則的例外。", "承買範圍：丙已有三分之一，不必購買自己的部分；其承買標的是甲、乙的三分之二。"], "law": "法條依據：土地法第34條之1第1項、第2項、第4項；民法第819條第2項。"}, {"title": "第三題｜多數共有人出賣共有土地全部", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一。甲、乙將A地全部出賣並移轉給丁，買賣契約及物權移轉效力如何？", "answer": ["（一）買賣契約", "答案：甲、乙與丁間的買賣契約有效。", "1. 大前提（法律／原理原則）：買賣是負擔行為，不以出賣人具有完整處分權為成立要件；依民法第348條，出賣人負交付並移轉所有權的義務。", "2. 小前提（事實）：甲、乙雖僅有合計三分之二的應有部分，仍與丁約定出售A地全部。", "3. 結論（法律效果）：買賣契約有效，丁得向甲、乙請求依約給付；但契約不拘束非當事人的丙。甲、乙不能完成給付時，應負債務不履行責任。", "（二）所有權移轉", "答案：甲、乙符合土地法的多數決門檻並依法完成程序及登記時，A地全部的所有權移轉有效。", "1. 大前提（法律／原理原則）：民法第819條第2項原則上要求共有物的處分須經全體同意；但土地法第34條之1第1項規定，共有人過半數且其應有部分合計過半數者，得處分共有土地全部。處分人並應依同條第2項事先書面通知他共有人，並依第3項處理其應得對價。不動產所有權移轉另須依民法第758條以書面為之並完成登記。", "2. 小前提（事實）：甲、乙占三名共有人中的二人，應有部分合計三分之二，人數與應有部分均超過二分之一，符合多數決門檻。", "3. 結論（法律效果）：甲、乙如已依法通知丙、使丙受領價金或為其提存，並與丁以書面作成物權意思表示及完成登記，A地全部的所有權移轉有效，丁取得A地所有權。若未符合土地法第34條之1的要件，即不得以多數決處分丙的應有部分。"], "concepts": ["負擔行為：只發生給付義務，不直接移轉既有權利，因此原則上不以處分權為必要。", "不動產物權行為：須有物權意思表示、書面、處分權及登記。土地法第34條之1使符合門檻的多數共有人取得處分共有土地全部的法定權限。", "少數共有人保障：丙得依土地法第34條之1第4項，以同一價格及條件優先承買甲、乙的應有部分。"], "law": "法條依據：土地法第34條之1第1項至第4項；民法第348條、第758條、第819條。"}, {"title": "第四題｜設定抵押權與部分共有人自行分割", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一：（一）甲、乙以A地全部為丁設定抵押權，其效力如何？（二）甲、乙自行分割A地，其效力如何？", "answer": ["（一）以A地全部設定抵押權", "答案：未經丙同意，甲、乙不得以A地全部設定抵押權；就丙權利所為的設定效力未定。", "1. 大前提（法律／原理原則）：民法第819條第2項規定，共有物設定負擔須全體共有人同意。土地法第34條之1第1項列舉的多數決事項不包含抵押權。無權處分依民法第118條第1項效力未定。", "2. 小前提（事實）：甲、乙未取得丙同意，卻以A地全部為丁設定抵押權。", "3. 結論（法律效果）：丙承認時，無權處分部分原則上溯及生效；丙拒絕承認時，該部分確定不生效。如已登記，丙得向丁依民法第767條第1項中段、第821條請求塗銷妨害共有權的登記。若僅以甲、乙自己的應有部分設定抵押，則屬有效。", "（二）甲、乙自行分割", "答案：甲、乙不能排除丙而有效協議分割A地。", "1. 大前提（法律／原理原則）：民法第824條第1項的分割協議須由全體共有人就分割方法達成合意；協議分割是不動產處分行為，並須依民法第758條以書面辦理登記。土地法第34條之1的多數決不適用共有物分割。", "2. 小前提（事實）：甲、乙雖占人數及應有部分多數，但丙未參與、未同意。", "3. 結論（法律效果）：甲、乙間就A地全部所作分割協議不拘束丙，亦不能有效完成協議分割。若違法辦理登記，丙得向登記名義人依民法第767條第1項中段請求塗銷；協議不成時，甲或乙得依民法第823條、第824條訴請裁判分割。"], "concepts": ["設定抵押權：使所有權受限制，屬物權處分行為。", "分割的兩階段：分割協議是負擔行為；辦理交付或登記的協議分割是處分行為。"], "law": "法條依據：土地法第34條之1；民法第118條、第758條、第767條、第819條、第823條、第824條。"}, {"title": "第五題｜全體共有人協議分割土地", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一。三人欲透過協議分割A地，應如何為之？", "answer": ["（一）訂立分割協議", "答案：甲、乙、丙應共同約定分割方法。", "1. 大前提（法律／原理原則）：依民法第824條第1項，共有物依共有人協議的方法分割；分割協議屬負擔行為，使共有人負有依約完成分割的義務。", "2. 小前提（事實）：甲、乙、丙均同意以協議方式分割A地。", "3. 結論（法律效果）：三人應共同約定各自分得的位置、面積及金錢補償等事項；協議成立後，彼此得請求履行。", "（二）完成協議分割", "答案：三人須以書面作成物權意思表示並完成分割登記，始發生物權效力。", "1. 大前提（法律／原理原則）：協議分割會消滅共有關係，屬處分行為。不動產物權變動依民法第758條須有物權意思表示、書面、處分權及登記。依民法第824條之1，共有人自分割效力發生時取得分得部分所有權。", "2. 小前提（事實）：A地是不動產，甲、乙、丙均為共有人並已同意依協議分割。", "3. 結論（法律效果）：三人完成分割登記後，共有關係消滅，各自取得分得土地的單獨所有權。一人拒絕配合時，他共有人得依分割協議請求其協同登記。"], "concepts": ["先協議、後登記：分割協議只產生履行義務；登記後才完成不動產協議分割。"], "law": "法條依據：民法第758條、第824條第1項、第824條之1第1項。"}, {"title": "第六題｜分割協議與十五年消滅時效", "prompt": "甲、乙、丙分別共有A地，應有部分各三分之一。三人於民國80年簽訂分割協議，於民國96年應如何主張？", "answer": ["（一）請求履行分割協議", "答案：甲仍得請求履行，但乙、丙得提出十五年消滅時效抗辯而拒絕。", "1. 大前提（法律／原理原則）：分割協議的履行請求權是債權請求權，依民法第125條原則上十五年不行使而消滅時效完成；依民法第144條，債務人須提出時效抗辯，始得拒絕給付。", "2. 小前提（事實）：自民國80年至96年已逾十五年；題目未見時效中斷或不完成事由。", "3. 結論（法律效果）：甲得向乙、丙請求協同辦理分割登記，但乙、丙得主張時效完成而拒絕。請求權本身不消滅，惟甲不能再強制履行。", "（二）改請求裁判分割", "答案：乙、丙拒絕履行後，甲仍得訴請法院裁判分割。", "1. 大前提（法律／原理原則）：共有物分割請求權不因分割協議履行請求權罹於時效而消滅。依民法第823條第1項、第824條第2項，協議履行請求權時效完成並經共有人拒絕履行時，任何共有人得請求法院分割。", "2. 小前提（事實）：乙、丙已得以時效抗辯拒絕履行民國80年的分割協議。", "3. 結論（法律效果）：甲得以乙、丙為被告，提起共有物分割訴訟，請求法院重新決定分割方法。"], "concepts": ["時效效果：消滅時效完成不使請求權自動消滅；債務人取得拒絕履行的抗辯權。", "時間法提示：民國98年修法將既有實務見解明文化；本題在民國96年仍可依當時實務處理。"], "law": "法條依據：民法第125條、第144條、第823條、第824條。"}, {"title": "第七題｜公同共有物遭第三人無權占有", "prompt": "甲、乙、丙公同共有A地，A地為丁無權占有。甲得否請求丁返還A地？", "answer": ["答案：甲得單獨起訴丁，但只能請求丁將A地返還給甲、乙、丙全體。", "1. 大前提（法律／原理原則）：民法第767條第1項賦予所有人對無權占有人之返還請求權。民法第828條第2項準用第821條，使公同共有人得就共有物全部對第三人行使所有權請求權；回復共有物時，只能為全體利益請求。", "2. 小前提（事實）：丁無權占有甲、乙、丙公同共有的A地；甲是公同共有人之一。", "3. 結論（法律效果）：甲得向丁依民法第767條第1項、第828條第2項準用第821條，請求返還A地；但請求內容應為返還給甲、乙、丙全體，不得只返還給甲。"], "concepts": ["公同共有：各公同共有人並無可自由處分的應有部分，而是基於公同關係共同享有權利。", "單獨起訴：現行民法第828條第2項已有明文準用第821條，修法前的爭議已獲解決。"], "law": "法條依據：民法第767條第1項、第821條、第828條第2項。"}, {"title": "第八題｜買賣不破租賃", "prompt": "甲將A屋出租給乙並交付占有，嗣後將A屋所有權移轉給丙。丙得否請求乙返還A屋？", "answer": ["（一）原則", "答案：丙不得請求乙返還A屋。", "1. 大前提（法律／原理原則）：民法第767條第1項的返還請求，以相對人無權占有為要件。依民法第425條第1項，租賃物交付後、承租人占有中，所有權雖移轉，租約對受讓人仍繼續存在。", "2. 小前提（事實）：甲先將A屋出租並交付乙，之後才將所有權移轉給丙；乙於移轉時仍占有A屋。", "3. 結論（法律效果）：租約對丙繼續存在，丙承受出租人地位；乙有權占有，丙不得向乙依民法第767條第1項請求返還。", "（二）例外", "答案：租約未經公證且期限逾五年或未定期限時，丙可能請求返還。", "1. 大前提（法律／原理原則）：民法第425條第2項規定，未經公證的不動產租約，其期限逾五年或未定期限者，不適用買賣不破租賃。", "2. 小前提（事實）：題目未交代租期及公證情形，不能逕認符合例外。", "3. 結論（法律效果）：本題原則上丙不得請求返還；如另證明租約未經公證且期限逾五年或未定期限，租約不能對抗丙，丙始得依民法第767條第1項請求乙返還。"], "concepts": ["法定契約承擔：民法第425條使受讓人依法承受出租人地位，是契約相對性原則的例外。", "不動產移轉：題目稱所有權已移轉，即以民法第758條所要求的書面與登記均已完成為前提。"], "law": "法條依據：民法第425條、第758條、第767條第1項。"}, {"title": "第九題｜共有土地之使用收益與返還請求", "prompt": "甲有A地一筆，並將右半部特定範圍無償借給乙使用。乙在該處經營停車場。其後甲將A地出賣並移轉給丙、丁，各取得二分之一應有部分。丙未經丁同意，又占用左半部經營停車場。丁分別請求乙、丙將各自占有部分返還給自己。丁的主張有無理由？", "answer": ["（一）丁對乙之返還請求", "答案：丁原則上得請求乙返還右半部，但只能請求返還給丙、丁全體；請求返還給丁自己並無理由。", "1. 大前提（法律／原理原則）：依民法第767條第1項前段，所有人得向無權占有人請求返還所有物；依第821條，各共有人得就共有物全部對第三人行使所有權請求權，但回復共有物時，只能為全體共有人利益為之。使用借貸依民法第464條只具債權效力，原則上不能拘束契約以外的土地受讓人。", "2. 小前提（事實）：甲與乙成立A地右半部的使用借貸後，才將A地移轉給丙、丁。丁不是使用借貸契約當事人，乙原則上不能以該契約對抗丁。", "3. 結論（法律效果）：乙對丁原則上屬無權占有。丁得向乙依民法第767條第1項前段、第821條請求返還；但應請求返還給丙、丁全體，不能請求返還給丁自己。", "（二）使用借貸能否類推買賣不破租賃", "答案：依否定說，使用借貸不得類推民法第425條；本題採此說，乙不能對抗丁。", "1. 大前提（法律／原理原則）：民法第425條使租賃契約對受讓人繼續存在，是契約相對性的例外。是否擴及無償使用借貸，學說有爭議：肯定說重視既存占有外觀與借用人的信賴；否定說認為債權物權化應從嚴，租賃有償、使用借貸無償，保護程度不同。", "2. 小前提（事實）：乙是無償借用人，不是承租人；法律並未明文使使用借貸對受讓人繼續存在。", "3. 結論（法律效果）：依課堂筆記及擬答採取的否定說，乙不得類推適用民法第425條。但丁如明顯違反誠信原則或以損害乙為主要目的，其返還請求仍可能受民法第148條限制。", "（三）丁對丙之返還請求", "答案：丁得請求丙返還左半部給丙、丁全體，但不能請求返還給丁自己。", "1. 大前提（法律／原理原則）：依民法第818條，共有人得按其應有部分對共有物全部使用收益；但應有部分是抽象比例，不等於共有物上的特定位置。排他使用特定部分，須有分管契約或依民法第820條作成合法管理決定。無合法權源而排除他共有人使用者，他共有人得依民法第767條、第821條為全體利益請求返還。", "2. 小前提（事實）：丙雖有二分之一應有部分，但未與丁成立分管契約，也未取得丁同意，即排他占用A地左半部。丙一人僅占二名共有人中的一人，應有部分也僅為二分之一，均未達第820條第1項的過半數門檻。", "3. 結論（法律效果）：丙不得將二分之一應有部分直接對應為A地左半部並排他使用。丁得請求丙返還左半部，但只能請求返還給丙、丁全體，不能請求返還給丁自己。"], "concepts": ["1. 使用借貸與租賃不同：使用借貸是無償契約；租賃是有償契約。民法第425條只明定租賃物所有權移轉後，租約對受讓人繼續存在。使用借貸能否類推適用，仍有肯定說與否定說之爭。", "2. 應有部分不是土地上的特定位置：丙取得二分之一應有部分，是對A地全部享有二分之一比例的權利，不代表丙取得左半部的單獨所有權。未經合法分管或管理決定，不得排除丁而獨占特定部分。", "3. 丁得起訴，但不能要求返還給自己：丁雖得單獨行使共有物返還請求權，回復共有物仍須為全體共有人利益。故丁正確的請求方式，是要求乙、丙返還給丙、丁全體，而不是交由丁個人占有。", "總結：乙與丙的占有原則上均欠缺對抗丁的合法權源，丁得分別請求返還；但丁只能請求返還給全體共有人。因此，丁要求返還給自己的主張並無理由，改為返還給丙、丁全體後始有理由。"], "law": "法條依據：民法第148條、第425條、第464條、第767條第1項、第818條、第820條及第821條。"}];
  const main=document.getElementById('main'),nav=document.getElementById('qnav'),picker=document.getElementById('picker');let current=0;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cls=s=>s.startsWith('答案：')?'direct':/^\d+\. 大前提/.test(s)?'major':/^\d+\. 小前提/.test(s)?'minor':/^\d+\. 結論/.test(s)?'conclusion':/^（[一二三四五六七八九十]+）/.test(s)?'issue':'';
  function shortTitle(t){return t.replace(/^第[一二三四五六七八九十]+題｜/,'')}
  QUESTIONS.forEach((q,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="num">第 ${i+1} 題</span>${esc(shortTitle(q.title))}`;b.onclick=()=>show(i);nav.appendChild(b);const o=document.createElement('option');o.value=i;o.textContent=`第 ${i+1} 題｜${shortTitle(q.title)}`;picker.appendChild(o)});picker.onchange=e=>show(Number(e.target.value));
  function flowHtml(lines){let issues=[],cur=null;for(const s of lines){if(/^（[一二三四五六七八九十]+）/.test(s)){cur={name:s,answer:''};issues.push(cur)}else if(s.startsWith('答案：')){if(!cur){cur={name:'核心爭點',answer:''};issues.push(cur)}cur.answer=s.replace('答案：','')}}return issues.map((x,i)=>`<div class="flow-step"><strong>${i+1}. ${esc(x.name)}</strong>${esc(x.answer)}</div>`).join('')}
  function show(i){current=i;const q=QUESTIONS[i];[...nav.children].forEach((b,n)=>b.classList.toggle('active',n===i));picker.value=i;main.innerHTML=`<section class="question-head"><div class="eyebrow">第 ${i+1} 題／共 ${QUESTIONS.length} 題</div><h2>${esc(shortTitle(q.title))}</h2><p class="prompt">${esc(q.prompt)}</p></section><nav class="jumpbar" aria-label="本題內容"><a href="#answer">考題答案</a><a href="#structure">解題結構</a><a href="#concepts">法律概念</a><a href="#laws">法條依據</a></nav><section class="section" id="answer"><h3 class="section-title"><span class="icon">答</span>考題答案</h3><div class="answer-list">${q.answer.map(s=>`<p class="line ${cls(s)}">${esc(s)}</p>`).join('')}</div></section><section class="section" id="structure"><h3 class="section-title"><span class="icon">析</span>解題結構</h3><div class="flow">${flowHtml(q.answer)}</div></section><section class="section" id="concepts"><h3 class="section-title"><span class="icon">念</span>法律概念</h3>${q.concepts.map(s=>`<div class="concept">${esc(s)}</div>`).join('')}</section><section class="section" id="laws"><h3 class="section-title"><span class="icon">法</span>法條依據</h3><div class="lawbox">${esc(q.law.replace('法條依據：',''))}</div></section><div class="pager"><button id="prev" ${i===0?'disabled':''}>← 上一題</button><button id="next" ${i===QUESTIONS.length-1?'disabled':''}>下一題 →</button></div>`;document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);window.scrollTo({top:0,behavior:'smooth'})}
  show(0);
  </script>
</body></html>
